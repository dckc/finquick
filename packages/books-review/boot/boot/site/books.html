<!doctype html><title>Books</title><meta charset="utf-8" />
<meta name="viewport" content="width=device-width" />
<link rel="stylesheet" href="/style.css" />
<h1>Books</h1>
<p id="status" role="status"></p>
<form id="load">
  <p>
    <label
      >What <code>git ls-tree -r &lt;tree&gt;</code> lists<br /><textarea
        name="listing"
        required
      ></textarea>
    </label>
  </p>
  <p>
    <label
      >Directory of the dump in the tree <input name="dir" value="dm93finance"
    /></label>
    <button>Load</button>
  </p>
</form>
<h2>Reviews</h2>
<ul id="books"></ul>
<h2>Model</h2>
<form id="model">
  <p>
    <label
      >API base URL
      <input name="url" size="40" placeholder="http://host:port/v1/"
    /></label>
    <label>model <input name="name" size="20" /></label>
    <label
      >API key
      <input name="key" type="password" size="20" placeholder="(unchanged)"
    /></label>
    <button>Save</button>
  </p>
</form>
<h2>Timeline</h2>
<p>
  <a id="timeline">The timeline page</a>, to open on your phone: it uploads
  visits from a Google Maps Timeline export. <span id="visits"></span>
</p>
<script src="/prelude.js"></script>
<script src="/boot.js"></script>
